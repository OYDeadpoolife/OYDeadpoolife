    <text x="188" y="286" fill="#91a5c8" font-size="14" letter-spacing="2">DETECT</text>
    <path d="M273 281H296m-5-5 5 5-5 5" fill="none" stroke="#527fe1" stroke-width="1.5"/>
    <text x="314" y="286" fill="#91a5c8" font-size="14" letter-spacing="2">AUTOMATE</text>
    <path d="M432 281H455m-5-5 5 5-5 5" fill="none" stroke="#527fe1" stroke-width="1.5"/>
