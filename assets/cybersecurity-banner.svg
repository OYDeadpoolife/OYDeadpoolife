<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Orhay Yosef — Cybersecurity Portfolio</title>
  <desc id="desc">A navy and royal blue portfolio banner with a gold accent, a shield, and four connected stages: network, detect, automate, investigate. Decorative diagram, not live security telemetry.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="1" stop-color="#10244b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8daee8" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#29416b"/>
  <path d="M44 46H83" stroke="#c9a75c" stroke-width="4"/>
